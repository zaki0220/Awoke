[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awoke"
version = "0.1.0"
description = "P2P earthquake notifications to Discord"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0,<13",
    "pyshp>=2.3,<3",
    "websockets>=12,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
awoke = "awoke.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
